version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cognitive_engine_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cognitive_engine
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cognitive_engine']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
